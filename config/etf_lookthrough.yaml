# ETF ルックスルー定義 (土曜設計書 提案2(a) / 提案4 の合流点)
#
# ## なぜ必要か
#
# 2026-08-01 の週次レポートが自ら指摘した穴:
#
#   > SOXL・TECL・TQQQ の3銘柄について、翌週の日程が取得できなかった。
#   > ETF自体に決算はないが、**構成銘柄の決算・FOMC等のマクロイベントは3倍で効く。**
#   > PFの過半（56.9%）については翌週何が起きるかを把握していない状態でこの週に入る。
#
# ETF に決算は無い。だが中身の企業には決算がある。そして3xなら3倍で効く。
#
# ## なぜ proxy を経由するのか
#
# レバレッジETFはスワップ・先物で複製するため、**開示される保有が実体を反映しない**。
# 実測: TQQQ の top_holdings は `IQMM` 単独で、ナスダック100構成銘柄が出てこない。
# したがって「レバレッジETF → 同じ原資産の1x ETF」を経由して中身を見る。
#
# ## 使ってはいけない用途
#
# ここで得た構成銘柄を「個別に売買する対象」として扱わない。
# 目的は **保有ETF経由で自分がどのイベントに曝されているかを知ること**の一点。

# ---------------------------------------------------------------------------
# レバレッジETF → 原資産を素直に追う1x ETF
# ---------------------------------------------------------------------------
proxies:
  SOXL:
    proxy: SOXX
    underlying: 半導体指数(SOX)
    leverage: 3
  TECL:
    proxy: XLK
    underlying: 米テクノロジーセクター
    leverage: 3
  TQQQ:
    proxy: QQQ
    underlying: ナスダック100
    leverage: 3
  # 参考: 逆・他倍率を持つ場合もここに追加する
  # SOXS: {proxy: SOXX, underlying: 半導体指数(SOX), leverage: -3}

# ---------------------------------------------------------------------------
# ティッカーを持たない投信 → 中身を近似するETF
# ---------------------------------------------------------------------------
# 投信は yfinance にティッカーが無く構成も取れない。近似ETFで中身を見る。
# **近似であることを出力に必ず明示する。**
fund_proxies:
  iFreeNEXT FANG+:
    proxy: QQQ
    note: NYSE FANG+指数の近似。構成は10銘柄の等ウェイトで QQQ とは異なる

# ---------------------------------------------------------------------------
# 取得設定
# ---------------------------------------------------------------------------
settings:
  # 各ETFから見る上位構成銘柄数。増やすとイベントが増えすぎて重要度が埋没する。
  top_n: 10
  # 実質エクスポージャーがこの%未満の構成銘柄はイベントを折り畳む
  min_effective_pct: 0.5
  # 構成情報のキャッシュ時間（時間）。構成は日々変わらない。
  cache_hours: 168
