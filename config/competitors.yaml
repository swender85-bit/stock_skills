# 競合・ベルウェザーマッピング（ブリーフィングパックの競合コンテキスト用）
#
# symbol -> peers: その銘柄の株価・バリュエーションと連動する「同業/競合」。
#   レバレッジETF（SOXL等）は原資産を動かす**ベルウェザー構成銘柄**を peers に置く。
#   NVDA の決算が SOX 指数を通じて SOXL を直撃する、という因果を Claude に渡すため。
#
# ここに無い銘柄はセクター一致でのフォールバックも試みる（competitors.py）。
# 見つからなければ競合節はスキップ（graceful degradation）。

peers:
  # --- 米国レバレッジETF（原資産のベルウェザー） ---
  SOXL: [NVDA, AVGO, AMD, TSM, MU, LRCX]
  TECL: [AAPL, MSFT, NVDA, AVGO, CRM, ORCL]
  TQQQ: [AAPL, MSFT, NVDA, AMZN, GOOGL, META]

  # --- 米国個別株 ---
  QCOM: [AVGO, NVDA, TXN, ADI, MRVL]
  MDT: [ABT, SYK, BSX, EW, JNJ]

  # --- 日本株 ---
  "2802.T": ["2801.T", "2809.T", "2871.T"]   # 味の素 ← キッコーマン/キユーピー/ニチレイ
  "9843.T": ["7453.T", "8227.T", "3086.T"]   # ニトリ ← 良品計画/しまむら/Jフロント

# ⚠️ **ここは保有と自動で同期しない。**
#
# 2737.T（トーメンデバイス）は 2026-08-07 に売却したが、この表に残っていたため
# **売った銘柄の競合を追い続けていた**。
#
# 現在は `src/core/research/watch_plan.py` が毎回いまの保有と突き合わせ、
# 非保有の銘柄は `stale_config` として名指しし、追跡対象から外す。
# したがってここに古い銘柄が残っていても実害は出ないが、
# **見通しを良くするため、売却したら消すこと。**
#
# 逆に、ここに無い保有銘柄はセクターから自動導出される（設定漏れで
# 「競合が見えない銘柄」が生まれない）。

# 補足メモ（Claude が因果を説明するときの手がかり。任意）
notes:
  SOXL: "半導体3x。NVDA/AVGO/TSM の決算とAI設備投資見通しが原資産(SOX)経由で直撃する。"
  TECL: "米テクノロジー3x。メガキャップの決算とAIマネタイズ観測がドラッグと同居する。"
  TQQQ: "ナスダック100の3x。指数上位のメガキャップ決算に感応。"
  QCOM: "スマホ需要とAppleモデム内製化リスク。AVGO/MediaTek との競合。"
  MDT: "医療機器の安定株。ABT/SYK/BSX とのシェア争いと金利感応（ディフェンシブ）。"
  "2802.T": "アミノ酸/電子材料(ABF)が半導体連動。食品ディフェンシブと半導体の二面性。"
  "9843.T": "円安が仕入れコスト増。国内消費と住宅関連需要に感応。"
  "2737.T": "サムスン向け半導体商社。為替と半導体在庫サイクルに感応。"
