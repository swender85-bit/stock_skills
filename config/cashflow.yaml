# 現金・入金・注意予算の設定 (土曜週次レポート連携設計書 提案9)
#
# ## なぜこれが要るか
#
# システムのポートフォリオ模型には現金と将来の入金が存在しなかった。その結果、
#
#   「Aを売ってBを買うべきか」に対する蓄積期の投資家の正解 ——
#   **「何もするな。8週後の入金でBを買え」** ——
#
# を出力する能力そのものが無かった（売却と購入しか語彙が無いため）。
#
# ## 取り扱い
#
# 入金額はあなたの収入に関わる情報です。
# - Neo4j には**絶対額を書きません**（比率のみ）。これはコードで強制しています。
# - レポートには投資可能額を出します（出さないと「8週待てば買える」が言えないため）。
#   出したくない場合は disclose_absolute_amounts を false にしてください。

# ---------------------------------------------------------------------------
# 入金
# ---------------------------------------------------------------------------
contributions:
  # 定期積立（月額・円）。実績から自動推定できない場合のベース。
  monthly_amount: 50000
  # 積立日（毎月）。null なら月初扱い。
  monthly_day: null
  # 賞与など不定期の入金がある場合はここに（date: YYYY-MM-DD / amount）
  irregular: []

# ---------------------------------------------------------------------------
# 入金額の推定
# ---------------------------------------------------------------------------
estimation:
  # 入出金実績から推定する際に見る週数
  lookback_weeks: 26
  # 推定に使うパーセンタイル。保守側に倒すため既定は下位25%。
  # 楽観的に平均を使うと「待てば買える」の見積もりが常に外れる。
  percentile: 25
  # ランウェイを何週先まで見るか
  runway_weeks: 12

# ---------------------------------------------------------------------------
# 現金の目的
# ---------------------------------------------------------------------------
# 目的の無い現金は、下落時に使われない傾向がある。
# purposes に割り当てた合計が現金残高に満たない場合、残りは「目的未割当」として警告。
cash:
  purposes: []
  # 例:
  # - label: 暴落時の買い増し用
  #   amount_jpy: 300000
  # - label: EEEE の取得予定
  #   amount_jpy: 500000

# ---------------------------------------------------------------------------
# 注意予算
# ---------------------------------------------------------------------------
# 保有銘柄数の上限は、リスク分散の理論値ではなく
# **あなたが実際に維持できる注意量**で決まる。
attention:
  # 週次レビューに割ける時間（分）
  weekly_review_minutes: 45
  # 1銘柄あたり最低これだけは要る（分）
  min_minutes_per_holding: 4

# ---------------------------------------------------------------------------
# 開示
# ---------------------------------------------------------------------------
privacy:
  # false にすると、レポートの入金額を絶対額でなく「N週分」で表現する
  disclose_absolute_amounts: true
