# ETF ルックスルー定義 (土曜設計書 提案2(a) / 提案4 の合流点)
#
# ## なぜ必要か
#
# 2026-08-01 の週次レポートが自ら指摘した穴:
#
#   > SOXL・TECL・TQQQ の3銘柄について、翌週の日程が取得できなかった。
#   > ETF自体に決算はないが、**構成銘柄の決算・FOMC等のマクロイベントは3倍で効く。**
#   > PFの過半（56.9%）については翌週何が起きるかを把握していない状態でこの週に入る。
#
# ETF に決算は無い。だが中身の企業には決算がある。そして3xなら3倍で効く。
#
# ## なぜ proxy を経由するのか
#
# レバレッジETFはスワップ・先物で複製するため、**開示される保有が実体を反映しない**。
# 実測: TQQQ の top_holdings は `IQMM` 単独で、ナスダック100構成銘柄が出てこない。
# したがって「レバレッジETF → 同じ原資産の1x ETF」を経由して中身を見る。
#
# ## 使ってはいけない用途
#
# ここで得た構成銘柄を「個別に売買する対象」として扱わない。
# 目的は **保有ETF経由で自分がどのイベントに曝されているかを知ること**の一点。

# ---------------------------------------------------------------------------
# レバレッジETF → 原資産を素直に追う1x ETF
# ---------------------------------------------------------------------------
proxies:
  SOXL:
    proxy: SOXX
    underlying: 半導体指数(SOX)
    leverage: 3
  TECL:
    proxy: XLK
    underlying: 米テクノロジーセクター
    leverage: 3
  TQQQ:
    proxy: QQQ
    underlying: ナスダック100
    leverage: 3
  # 参考: 逆・他倍率を持つ場合もここに追加する
  # SOXS: {proxy: SOXX, underlying: 半導体指数(SOX), leverage: -3}

# ---------------------------------------------------------------------------
# ティッカーを持たない投信 → 中身を近似するETF
# ---------------------------------------------------------------------------
# 投信は yfinance にティッカーが無く構成も取れない。近似ETFで中身を見る。
# **近似であることを出力に必ず明示する。**
fund_proxies:
  iFreeNEXT FANG+:
    proxy: QQQ
    note: NYSE FANG+指数の近似。構成は10銘柄の等ウェイトで QQQ とは異なる

# ---------------------------------------------------------------------------
# 構成を明示的に指定する投信（proxy より優先）
# ---------------------------------------------------------------------------
# ## なぜ必要か
#
# FANG+ を QQQ で近似していたが、**両者は別物**である:
#
#   NYSE FANG+ : 10銘柄・**等ウェイト**（各10%）
#   QQQ        : 100銘柄・**時価総額加重**（上位10で46%）
#
# QQQ 近似では、FANG+ が持たない銘柄（COST・PEP 等）に曝露があることになり、
# 逆に FANG+ の各銘柄10%という**均等な重み**が再現されない。
# 実効エクスポージャー表がその分だけ歪む。
#
# ## 使い方
#
# `verified_as_of` を入れて初めて「確認済み」として扱われる。
# 空のあいだは出力に「**未確認の構成**」と明示される（黙って使わない）。
#
# 構成は四半期ごとに見直される。運用会社の月次レポート
# （大和アセットマネジメント「iFreeNEXT FANG+インデックス」）で確認できる。
explicit_constituents:
  iFreeNEXT FANG+:
    # ⚠️ 未確認。確認したら日付を入れる（例: 2026-08-09）
    verified_as_of: null
    source: "NYSE FANG+ Index（等ウェイト10銘柄）"
    weighting: equal
    note: |
      等ウェイトなので各銘柄10%。銘柄は四半期リバランスで入れ替わる。
      verified_as_of が空のあいだは「未確認の構成」として出力に明示される。
      確認先: 大和アセットマネジメント の月次レポート、または NYSE FANG+ 指数の構成銘柄。
    symbols:
      - META
      - AAPL
      - AMZN
      - NFLX
      - GOOGL
      - MSFT
      - NVDA
      - TSLA
      - AVGO
      - CRWD

# ---------------------------------------------------------------------------
# テクニカル判定用の代理指数
# ---------------------------------------------------------------------------
# 投信は基準価額の時系列が yfinance から取れないため、RSI・%B・52週位置が
# 一つも計算できず「判定不能」になる。2026-08-01 のレポートでは PF の 6.9%
# （FANG+）がこの状態だった。
#
# ここでは **中身の近似ではなく、その投信が連動を目指す指数そのもの** を使う。
# `^NYFANG` は iFreeNEXT FANG+ が連動対象とする NYSE FANG+ 指数。
# 為替（円建て基準価額 vs ドル建て指数）の差は残るので、**指数由来であることを
# 出力に必ず明示する**。値動きの方向と過熱度を見る用途に限る。
technical_proxies:
  iFreeNEXT FANG+:
    proxy: "^NYFANG"
    # §16-8「単一の取得元に依存しない」。指数が引けなかった週に
    # 「判定不能」で終わらせないための予備。
    # FNGS は同じ NYSE FANG+ 指数に連動する ETN で、実測相関は指数とほぼ一致。
    # （参考: QQQ との相関は 0.867、年率ボラも 19.6% vs 23.1% で**別物**。
    #   QQQ を代理に使ってはいけない）
    fallback: FNGS
    note: NYSE FANG+指数（連動対象指数そのもの）。円建て基準価額とは為替分ずれる

# ---------------------------------------------------------------------------
# 取得設定
# ---------------------------------------------------------------------------
settings:
  # 各ETFから見る上位構成銘柄数。増やすとイベントが増えすぎて重要度が埋没する。
  top_n: 10
  # 実質エクスポージャーがこの%未満の構成銘柄はイベントを折り畳む
  min_effective_pct: 0.5
  # 構成情報のキャッシュ時間（時間）。構成は日々変わらない。
  cache_hours: 168
