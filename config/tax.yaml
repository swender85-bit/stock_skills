# 税制・手数料の設定 (土曜週次レポート連携設計書 提案3)
#
# ⚠️ 重要 —— このファイルの数値は**あなたが確認して維持するもの**です。
#
# 設計書 提案3-④ の注記:
#   「税制は毎年変わる。税率・NISA枠・繰越年数・外国税額控除の要件は、
#     実装時点の最新の法令および国税庁の情報を確認して設定ファイル化すること。
#     ハードコード禁止。」
#
# システムはここに書かれた値をそのまま使い、**税務助言は行いません**。
# レポートには常に「概算であり税務助言ではない」旨が付きます。
# 個別の税務判断は税理士に確認してください。
#
# 確認したら verified_as_of を更新してください。古いままだとレポートに
# 「税制設定が N 日確認されていません」と出ます。

meta:
  # 最後に人が内容を確認した日。空欄なら「未確認」として警告が出ます。
  #
  # 2026-08-05: 本人確認済み（譲渡益 20.315% / 損失繰越3年 / NISA枠）。
  # このシステムは税務助言を行いません。値の正しさは確認した本人の責任です。
  # 税制は毎年変わるので、次の確認は stale_warning_days 経過前に行ってください。
  verified_as_of: 2026-08-05
  # 何日確認していなければ警告するか
  stale_warning_days: 400
  source_hint: |
    国税庁 タックスアンサー（譲渡所得・配当所得）、金融庁 NISA特設ページ、
    利用証券会社の手数料表を確認してください。

# ---------------------------------------------------------------------------
# 譲渡益課税
# ---------------------------------------------------------------------------
capital_gains:
  # 特定口座・一般口座の税率（所得税+復興特別所得税+住民税の合計）
  rate: 0.20315
  # 内訳（表示用。合計は rate を使う）
  breakdown:
    income_tax: 0.15
    reconstruction_surtax: 0.00315
    resident_tax: 0.05
  # 損失の繰越控除年数
  loss_carryforward_years: 3

# ---------------------------------------------------------------------------
# 配当課税
# ---------------------------------------------------------------------------
dividends:
  # 国内株の配当にかかる税率
  domestic_rate: 0.20315
  # 米国株配当の米国側源泉徴収率（租税条約）
  us_withholding_rate: 0.10
  # 外国税額控除は確定申告時のみ。自動では戻らないので、
  # 既定では「戻らない前提」で手取りを計算する（保守側）。
  assume_foreign_tax_credit: false

# ---------------------------------------------------------------------------
# 口座区分
# ---------------------------------------------------------------------------
# taxable      … 譲渡益に課税され、損失は損益通算できる
# tax_free     … 譲渡益は非課税。ただし**損失も損益通算できない**（下方非対称）
#
# NISA の損失が通算できない点は、暴落時の意思決定を根本的に変えるが
# （設計書 提案6-①(c)）、口座区分を持たないシステムは区別できない。
accounts:
  特定:
    kind: taxable
    label: 特定口座（源泉徴収あり）
  一般:
    kind: taxable
    label: 一般口座
  NISA成長:
    kind: tax_free
    label: NISA 成長投資枠
    nisa_bucket: growth
  NISAつみたて:
    kind: tax_free
    label: NISA つみたて投資枠
    nisa_bucket: tsumitate
  # 判定できない口座名はここにフォールバックする
  _default:
    kind: taxable
    label: 不明（課税口座として扱う）

# ---------------------------------------------------------------------------
# NISA 枠（年間）
# ---------------------------------------------------------------------------
# 使い残しは翌年に繰り越せない。つまり「どの銘柄に枠を与えるか」は
# 最適配分問題であり、システムが解くべき問題である（設計書 提案3-①(b)）。
nisa:
  annual_limits:
    growth: 2400000        # 成長投資枠 年間
    tsumitate: 1200000     # つみたて投資枠 年間
  lifetime_limit: 18000000
  lifetime_growth_limit: 12000000
  # 年内に使い切れない見込みを警告する残り週数
  expiry_warning_weeks: 26

# ---------------------------------------------------------------------------
# 手数料・為替
# ---------------------------------------------------------------------------
# 為替スプレッドは、往復で売買手数料より大きいことが多い。
# 「乗り換えたほうがよい」の判定はここを入れないとほぼ必ず楽観側に外れる。
fees:
  jp_stock:
    # 約定代金に対する率（0 なら定額プランなど）
    rate: 0.0
    fixed: 0
  us_stock:
    rate: 0.00495          # 約定代金の 0.495%
    min: 0                 # 最低手数料（現地通貨）
    max: 22.0              # 上限（USD）
  fx:
    # 円→ドルの片道スプレッド（1ドルあたり円）。往復ならこの2倍。
    usdjpy_spread_per_usd: 0.25
